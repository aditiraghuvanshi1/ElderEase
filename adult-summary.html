<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B2A41">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <title>Doctor summary · ElderEase</title>
</head>
<body data-page-role="adult">

    <header class="main-header">
        <div class="container header-flex">
            <div>
                <a class="brand" href="adult.html">ElderEase</a>
                <p class="subtitle"><span data-i18n="welcome">Welcome back,</span> <strong id="display-profile-name"></strong></p>
            </div>
            <div class="header-controls">
                <span id="lang-slot"></span>
                <button type="button" id="elder-mode-btn" class="header-btn" aria-pressed="false">Larger text</button>
                <a href="index.html" class="logout-link" data-action="logout" data-i18n="logout">Log out</a>
            </div>
        </div>
        <div class="container"><nav id="app-nav"></nav></div>
    </header>

    <main class="container page-main">
        <section class="page-intro no-print">
            <h1 data-i18n="sm_title">Doctor Summary</h1>
            <p class="form-intro" data-i18n="sm_intro"></p>
            <div class="sum-controls">
                <label for="sum-period" data-i18n="period"></label>
                <select id="sum-period"><option value="7" data-i18n="last7"></option><option value="14" data-i18n="last14"></option><option value="30" data-i18n="last30"></option></select>
                <button type="button" class="btn btn-primary" id="dl-pdf" data-i18n="dl_pdf"></button>
            </div>
            <p class="hint-line" data-i18n="pdf_tip"></p>
        </section>

        <article id="report" class="report"></article>
    </main>

    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script src="features.js"></script>
    <script src="healthdata.js"></script>
    <script src="summary.js"></script>
</body>
</html>
